{% extends "base.html" %}
{% block titulo %}Árbitros{% endblock %}
{% block contenido %}
{% include "admin/_menu.html" %}
<section class="portada"><div><p class="etiqueta">Administración</p><h1>Árbitros</h1></div></section>
<div class="rejilla-2">
  <section class="tarjeta">
    <table class="tabla">
      <thead><tr><th>Árbitro</th><th class="num">Partidos</th></tr></thead>
      <tbody>{% for a in arbitros %}<tr><td>{{ a.Nombre }}</td><td class="num">{{ a.Partidos }}</td></tr>{% endfor %}</tbody>
    </table>
  </section>
  <section class="tarjeta">
    <div class="tarjeta-cabecera"><h2>Nuevo árbitro</h2></div>
    <form method="post" action="{{ url_for('crear_arbitro') }}" class="formulario">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <label>Nombre completo <input name="nombre" required maxlength="80"></label>
      <button class="boton boton-principal">Añadir árbitro</button>
    </form>
  </section>
</div>
{% endblock %}
