{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block contenido %}
<section class="tarjeta formulario-estrecho">
  <h1>Administración</h1>
  <p class="nota">Acceso solo para el administrador de {{ app_nombre }}.</p>
  <form method="post" class="formulario">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>Usuario <input name="usuario" autocomplete="username" required maxlength="50"></label>
    <label>Contraseña <input name="clave" type="password" autocomplete="current-password" required></label>
    <button class="boton boton-principal">Entrar</button>
  </form>
</section>
{% endblock %}
