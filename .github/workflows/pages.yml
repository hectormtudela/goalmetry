# Publica la carpeta sitio/ (la web de solo lectura de Goalmetry) en GitHub Pages.
# La carpeta la genera publicar-web.ps1 en tu ordenador, con los datos de SQL Server, y se sube con git.
# Aquí no hay secretos ni base de datos: solo se copian los ficheros ya generados.
name: Publicar la web de solo lectura

on:
  push:
    branches: [main]
    paths:
      - "sitio/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
